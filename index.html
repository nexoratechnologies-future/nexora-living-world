
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEXORA LIVING WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080d18;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#101827dd;padding:12px;border:1px solid #40516c;border-radius:10px}
#hud b{color:#54e8ff}
#menu{position:fixed;top:12px;right:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button,select{background:#172943;color:white;border:1px solid #5b789e;border-radius:7px;padding:10px;font-size:13px}
button:active{background:#267c9b}
#help{position:fixed;bottom:12px;left:12px;background:#101827cc;padding:10px;border-radius:8px;font-size:12px}
#touch{position:fixed;bottom:18px;right:14px;display:none;z-index:6;gap:8px}
#touch button{width:58px;height:58px;border-radius:50%;font-size:18px}
#message{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#101827dd;padding:10px 16px;border-radius:8px;display:none}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>

<div id="hud">
  <b>NEXORA LIVING WORLD</b><br>
  Player: Alex<br>
  City: Nexora City<br>
  <span id="status">Loading city...</span><br>
  <span id="qualityText">Graphics: Balanced</span>
</div>

<div id="menu">
  <select id="quality">
    <option value="balanced">Balanced</option>
    <option value="high">High</option>
    <option value="4k">4K Mode</option>
  </select>
  <button id="camera">Camera: Third Person</button>
  <button id="day">Day / Night</button>
</div>

<div id="help">
  PC: WASD move | SHIFT run | SPACE jump | V camera | E interact<br>
  Mobile: Use the touch buttons
</div>

<div id="touch">
  <div>
    <button data-key="w">▲</button><br>
    <button data-key="a">◀</button>
    <button data-key="s">▼</button>
    <button data-key="d">▶</button>
  </div>
  <div>
    <button data-key=" ">JUMP</button><br>
    <button data-key="shift">RUN</button>
    <button id="mobileCamera">CAM</button>
  </div>
</div>

<div id="message"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc9e8);
scene.fog = new THREE.Fog(0x8fc9e8, 100, 650);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 1500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING
const skyLight = new THREE.HemisphereLight(0xcceaff, 0x536044, 2);
scene.add(skyLight);

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(100, 180, 100);
scene.add(sun);

// MATERIALS
const materials = {
  road: new THREE.MeshStandardMaterial({color:0x252a32}),
  grass: new THREE.MeshStandardMaterial({color:0x43824c}),
  line: new THREE.MeshStandardMaterial({color:0xe7e2bd}),
  glass: new THREE.MeshStandardMaterial({
    color:0x6da8c9, metalness:0.35, roughness:0.25
  }),
  white: new THREE.MeshStandardMaterial({color:0xe4e8ee}),
  dark: new THREE.MeshStandardMaterial({color:0x333d4c})
};

function box(w,h,d,mat,x,y,z,parent=scene){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), mat
  );
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

// GROUND
box(1600,1,1600,materials.grass,0,-0.6,0);

// HUGE CITY GRID
const CITY_SIZE = 11;
const BLOCK = 46;
const ROAD = 13;
const cityLimit = CITY_SIZE * BLOCK;

for(let x=-CITY_SIZE/2;x<=CITY_SIZE/2;x++){
  for(let z=-CITY_SIZE/2;z<=CITY_SIZE/2;z++){
    const px=x*BLOCK;
    const pz=z*BLOCK;

    // Road grid
    box(ROAD,0.15,BLOCK,materials.road,px,0,pz);
    box(BLOCK,0.15,ROAD,materials.road,px,0,pz);

    // Road markings
    box(0.25,0.17,BLOCK,materials.line,px,0.09,pz);
    box(BLOCK,0.17,0.25,materials.line,px,0.09,pz);

    // Four building plots per block
    for(let sx of [-1,1]){
      for(let sz of [-1,1]){
        const bx=px+sx*14;
        const bz=pz+sz*14;
        const width=10+Math.random()*6;
        const depth=10+Math.random()*6;
        const height=9+Math.random()*65;

        const color=new THREE.Color().setHSL(
          0.53+Math.random()*0.12,
          0.12+Math.random()*0.2,
          0.35+Math.random()*0.3
        );

        const buildingMat=new THREE.MeshStandardMaterial({
          color,roughness:0.7
        });

        box(width,height,depth,buildingMat,
          bx,height/2,bz);

        // Windows
        const floors=Math.floor(height/4);
        for(let f=1;f<floors;f++){
          if(Math.random()>0.35){
            box(width*0.65,0.7,0.12,materials.glass,
              bx,height/2-height/2+f*4,bz+depth/2+0.07);
          }
        }

        // Rooftop structure
        if(height>35){
          box(width*0.3,2,depth*0.3,materials.dark,
            bx,height+1,bz);
        }
      }
    }
  }
}

// PARKS AND TREES
const treeMat=new THREE.MeshStandardMaterial({color:0x176a36});
const trunkMat=new THREE.MeshStandardMaterial({color:0x68452b});

function makeTree(x,z){
  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.4,0.6,4,7),trunkMat
  );
  trunk.position.set(x,2,z);
  scene.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(2.8,8,7),treeMat
  );
  leaves.position.set(x,5,z);
  scene.add(leaves);
}

for(let i=0;i<180;i++){
  const x=(Math.random()-0.5)*cityLimit*1.8;
  const z=(Math.random()-0.5)*cityLimit*1.8;
  if(Math.abs(x%BLOCK)>10 && Math.abs(z%BLOCK)>10){
    makeTree(x,z);
  }
}

// PLAYER
const player=new THREE.Group();

const bodyMat=new THREE.MeshStandardMaterial({color:0x2467ce});
const skinMat=new THREE.MeshStandardMaterial({color:0xd5a27e});

const body= new THREE.Mesh(
  new THREE.BoxGeometry(1,1.5,0.55),bodyMat
);
body.position.y=1.55;
player.add(body);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.38,12,10),skinMat
);
head.position.y=2.55;
player.add(head);

scene.add(player);
player.position.set(0,0,0);

// CAMERA
let firstPerson=false;
let yaw=0;
let pitch=0.15;

function updateCamera(){
  if(firstPerson){
    camera.position.set(
      player.position.x,
      player.position.y+2.45,
      player.position.z
    );
    camera.rotation.order="YXZ";
    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
  }else{
    const distance=8;
    const height=4;
    camera.position.set(
      player.position.x-Math.sin(yaw)*distance,
      player.position.y+height,
      player.position.z-Math.cos(yaw)*distance
    );
    camera.lookAt(
      player.position.x,
      player.position.y+1.4,
      player.position.z
    );
  }
}

// CONTROLS
const keys={};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if([" ","arrowup","arrowdown"].includes(e.key.toLowerCase()))
    e.preventDefault();

  if(e.key.toLowerCase()==="v") toggleCamera();
  if(e.key.toLowerCase()==="e") showMessage("New city missions coming soon!");
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// Mobile controls
document.querySelectorAll("[data-key]").forEach(btn=>{
  const key=btn.dataset.key;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });
  ["pointerup","pointerleave","pointercancel"].forEach(event=>{
    btn.addEventListener(event,()=>keys[key]=false);
  });
});

// Touch camera look
let touchX=null;
renderer.domElement.addEventListener("touchstart",e=>{
  if(e.touches.length===1) touchX=e.touches[0].clientX;
},{passive:true});

renderer.domElement.addEventListener("touchmove",e=>{
  if(touchX!==null && e.touches.length===1){
    const x=e.touches[0].clientX;
    yaw-=(x-touchX)*0.006;
    touchX=x;
  }
},{passive:true});

renderer.domElement.addEventListener("touchend",()=>touchX=null);

// Mouse camera look
let dragging=false,lastX=0;
renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"){
    dragging=true;
    lastX=e.clientX;
  }
});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(dragging){
    yaw-=(e.clientX-lastX)*0.004;
    lastX=e.clientX;
  }
});

function toggleCamera(){
  firstPerson=!firstPerson;
  document.getElementById("camera").textContent=
    "Camera: "+(firstPerson?"First Person":"Third Person");
}
document.getElementById("camera").onclick=toggleCamera;
document.getElementById("mobileCamera").onclick=toggleCamera;

// GRAPHICS SETTINGS
const quality=document.getElementById("quality");
quality.onchange=()=>{
  const mode=quality.value;
  if(mode==="balanced"){
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
    renderer.shadowMap.enabled=false;
    document.getElementById("qualityText").textContent=
      "Graphics: Balanced";
  }
  if(mode==="high"){
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
    renderer.shadowMap.enabled=true;
    sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);
    document.getElementById("qualityText").textContent=
      "Graphics: High";
  }
  if(mode==="4k"){
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    document.getElementById("qualityText").textContent=
      "Graphics: 4K Mode (device dependent)";
    showMessage("4K mode selected. Performance depends on your device.");
  }
};

// DAY / NIGHT
let night=false;
document.getElementById("day").onclick=()=>{
  night=!night;
  if(night){
    scene.background.set(0x071326);
    scene.fog.color.set(0x071326);
    sun.intensity=0.25;
    skyLight.intensity=0.5;
  }else{
    scene.background.set(0x8fc9e8);
    scene.fog.color.set(0x8fc9e8);
    sun.intensity=2;
    skyLight.intensity=2;
  }
};

// MESSAGE
function showMessage(text){
  const el=document.getElementById("message");
  el.textContent=text;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",2500);
}

// PLAYER MOVEMENT
let velocityY=0;
let onGround=true;

function updatePlayer(delta){
  const forward=(keys["w"]||keys["arrowup"]?1:0)-
    (keys["s"]||keys["arrowdown"]?1:0);
  const sideways=(keys["d"]||keys["arrowright"]?1:0)-
    (keys["a"]||keys["arrowleft"]?1:0);

  const running=keys["shift"]?1.8:1;
  const speed=12*running*delta;

  const direction=new THREE.Vector3(
    Math.sin(yaw),0,Math.cos(yaw)
  );
  const right=new THREE.Vector3(
    Math.cos(yaw),0,-Math.sin(yaw)
  );

  player.position.x+=
    (direction.x*forward+right.x*sideways)*speed;
  player.position.z+=
    (direction.z*forward+right.z*sideways)*speed;

  if(forward!==0||sideways!==0){
    player.rotation.y=Math.atan2(
      direction.x*forward+right.x*sideways,
      direction.z*forward+right.z*sideways
    );
  }

  if(keys[" "]&&onGround){
    velocityY=10;
    onGround=false;
  }

  velocityY-=25*delta;
  player.position.y+=velocityY*delta;

  if(player.position.y<0){
    player.position.y=0;
    velocityY=0;
    onGround=true;
  }

  const limit=cityLimit*0.9;
  player.position.x=THREE.MathUtils.clamp(
    player.position.x,-limit,limit
  );
  player.position.z=THREE.MathUtils.clamp(
    player.position.z,-limit,limit
  );
}

// RESIZE
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// GAME LOOP
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),0.04);

  updatePlayer(delta);
  updateCamera();

  document.getElementById("status").textContent=
    "Position: "+Math.round(player.position.x)+
    ", "+Math.round(player.position.z);

  renderer.render(scene,camera);
}

showMessage("Welcome to Nexora City, Alex!");
animate();

</script>
</body>
</html>
